name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      # D-030: no `version` input; pnpm comes from packageManager "pnpm@12.14.0".
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # D-291: no Docker in this job; docker tests run in docker-it.
      - run: pnpm check
        env:
          MANDAT_COUNTS_REQUIRE: unit

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD":/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config=/repo/.gitleaks.toml --redact --no-banner

  docker-it:
    needs: check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # D-131. The commands below appear in E0.2а–E0.3б; until then this job fails by design (see docs/progress.md).
      - run: pnpm mandat images build --ui
      - run: pnpm mandat fixtures build
      - run: pnpm test:docker
      - run: pnpm mandat bench
      - run: pnpm mandat redteam
