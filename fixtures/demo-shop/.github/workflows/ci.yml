# Runs the tests FROM HEAD, so a deleted test stays green here (демо промпт т. 9.1, сцена 3).
name: ci
on:
  push:
    branches: [main]
  pull_request: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.0"
      - run: npm ci --ignore-scripts
      - run: npx vitest run
